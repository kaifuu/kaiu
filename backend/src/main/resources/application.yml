server:
  port: ${SERVER_PORT:8181}

spring:
  application:
    name: emergency-inspection
  # 默认 dev:本地零环境变量即可启动;生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
  # 数据源等敏感配置按环境拆分到 application-dev.yml / application-prod.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 建表脚本幂等(全部 IF NOT EXISTS),每次启动执行;与 docker-entrypoint-initdb.d 共用同一份文件
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      continue-on-error: false
  jackson:
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  issuer: emergency-inspection
  ttl-hours: 12

# 设备接入:大疆上云 API(机场 / 无人机经 MQTT 直连本平台的 Netty Broker)
dji:
  mqtt:
    enabled: true
    port: 1883                # 设备连接的 MQTT 端口
    max-connections: 500
    idle-timeout-seconds: 180 # 读空闲超时(设备每 30s 发 PINGREQ,超时即判掉线)
  command:
    timeout-seconds: 15       # 指令下发后等待 services_reply 的超时
    history-keep: 2000        # 指令记录保留条数

# 飞行安全预警规则阈值(围栏闯入/预测闯入/电量骤降/高度突变)
safe-alert:
  predict-horizon-seconds: 60   # 轨迹外推时长
  predict-steps: 8              # 外推步数
  predict-cooldown-ms: 300000   # 预测预警冷却
  breach-cooldown-ms: 300000    # 实时闯入预警冷却
  battery-window-seconds: 300   # 电量观察窗口
  battery-drop-percent: 15      # 窗口内掉电百分比阈值
  battery-cooldown-ms: 600000
  altitude-jump-meters: 40      # 相邻遥测高度跳变阈值
  altitude-cooldown-ms: 300000
