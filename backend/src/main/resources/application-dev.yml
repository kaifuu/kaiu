# 本地开发配置:零环境变量即可启动(数据库对应 docker-compose.yml 中的 PostgreSQL)
spring:
  datasource:
    # 容器把 5432 映射到宿主机 5433,避开本机可能已占用的 5432
    url: jdbc:postgresql://localhost:5433/emergency_inspect
    driver-class-name: org.postgresql.Driver
    username: inspect
    password: inspect123

jwt:
  # 仅开发用默认值;生产由 application-prod.yml 强制要求环境变量
  secret: ${JWT_SECRET:emergency-inspection-platform-default-secret-key-2026}

# 默认密码(人员管理新增/重置时使用)
user:
  default-password: "123456"

# 演示数据开关:点位/任务/工单/告警历史/臭气站等仅开发环境注入
app:
  seed:
    demo-data: true

logging:
  level:
    com.emergency: info
